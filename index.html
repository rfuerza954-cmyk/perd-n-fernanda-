< ! DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
	  content="width=device-width, initial-
		   scale=1.0">
    <title>Para ti:) </title>
<style>
* {	
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}
body {
	background: #000;
	color: white;
	font-family: Arial, sans-serif;
	min-height: 100vh;
	overflow: hidden;
}
/* Corazones */
#hearts {
	position: fixed;
	inset: 0;
	overflow: hidden;
	pointer-events: none;
	z-index: 0;
}
.heart {
	position: absolute;
	top: -50px;
	animation: caer  linear infinite;
	filter: drop-shadow(0 0 7px
		currentColor);
}
@keyframes caer {
	0% {
		transform: trasnlateY(-50px)
		rotate(0deg);
		opacity: 0;
	}
	10% {
		opacity: 1;
	}
	90% {
	}
	100% {
		transform: translateY(110vh)
		rotate(360deg);
		opacity: 0;
	}
}
/* Páginas */
.page {
	position: relative;
	z-index: 1;
	width: 100%;
	min-height: 100vh;
display: none; 
align-items: center;
justify-content: center;

padding: 20px;
}
.page.active {
	display flex;
}
/* Tarjeta */
.card {
	width: 100%;
	max-width; 500px;

	background: rgba(0, 0, 0, 0.88);

	border: 1px solid #ff3b72;
	border-radius: 18px;

	padding: center;

	text-align: center;

	box-shadow: 0 0 30px rgba(255, 59, 114, 0.18);

	animation: aparecer 0.6s ease;
}

@keyframes aparecer {
	from {
		opacity: 0;
		transform: translateY(0);
	}
}
/* Corazon principal */
.main-heart {
	font-size: 50px;
	color: #ff3b72;
	margin-bottom: 20px;

	animation: latir 1.5s infinite;
}

@keyframes latir {
	0%, 100% {
		transform: scale(1);
	}
	50% {
		transform: scale(1.2);
	}
}
h1 {
	font-size: 26px;
	margin-bottom: 15px;
}

.subtitle {
	color: #aaa;
	font-size: 14px;
	margin-bottom: 25px;
}
/* Entrada */ input {
	width: 100%;

	padding: 15px;

	background: transparent;

	border: 1px solid #54202e;
	border-radius: 10px;

	color: white;
	
	font-size: 16px;
	text-align: center;

	outline: none;

	margin-bottom: 12px;
}
input::placeholder {
	color: #777;
}
input:focus {
	border-color: #ff3b72;

	box-shadow:
		0 0 15px rgba(255, 59, 114, 0.2);
}
/* Error */
#error {
	color: #ff526f;
	font-size: 13px;

	height: 20px;

	opacity: 0;
}
#eror.shadow {
	opacity: 1;
}
/* Botón */
button {
	margin-top: 10px;

	padding: 13px 30px;

	background: transparent;

	border: 1px solid #ff3b72;
	border-radius: 10px;

	color: #ff3b72;

	font-size: 15px;
	cursor: pointer;

	transition: 0.25s;
}
button:hover {
	background: rgba(255, 59, 114, 0.12);
}
/* Mensaje */
.message {
	font-size: 19px; 
	line-height: 1.8;
	color: #f0e8e8;
}
/* Celular */
@media (max-widht: 500px);

.card {
	padding: 35px 22px;
}
h1 {
	font-size: 23px;
}
.message {
	font-size: 17px;
	line-height: 1.8;
}
}
</style>
</head>

<body>

	<!-- Corazones que caen -->
	<div id="hearts"></div>

	<!-- PRIMERA PÁGINA -->
	<section class="page active" id="page1">

		<div class="main-heart">❤️</div>

		<h1>¿Cuall es tu nombre?</h1>

		<p class="subtitle">
		"pon tu nombre aqui para continuar..."
		</p>

		<input
				type="text"
				id="name"
				placeholder:="Pon tu nomre aqui..."
				autocomplete:"off"
				>

				<div id="error">
					este menjensaje no es para ti
				</div>
		<button onclick="entrar()">
			Continuar 
		</button>

		</div>

	</section>
	<!-- SEGUNDA PÁGINA -->
	<section class="page" id="page2">

		<div class="card">
			<div class="main-heart">❤️</div>

			<div class="message">
			perdon por no ser el chico que imaginabas, fui un tonto al no saber valorar tu amor estos dias me eh sentifo mal te estraño, fui un patan contigo😔	


		    <div>

		</div>

	</section>


	<script>

		/* Nombre que puede entar */
		const nombreCorrecto = "fernanda";

		/*Cambiar página */
		function entrar() {

			const input =
				document.getElementById("name");
			const error =
				document.getElementById("error");

			const nombre =
				input.value.trim().toLowerCase();

			if (nombre === nombreCorrecto) {

				error.classList.remove("show");

				document
				.getElementById("page1")
				.classList.remove("active");

				document
				.getElementById("page2");
				.classList.remove("active");

			} else {

				error.classList.add("show");

				input.value = "";

				input.focus();
			}
		}

		/* Poder presionar ENTER */
		document
		.getElementById("name")
		.addEventListener("keydown"),
			function(event) {

				if (event.key === "Enter") {
					entrar();
				}

			});

		/* Colores de los corazones */
		const colores = [
			"#ff1744",
			"#ff4081",
			"#e040fb",
			"#7c4dff",
			"#2979ff",
			"#00e5ff",
			"#00e676",
			"#76ff03",
			"#ffea00",
			"#ffc400",
			"#ff9100",
			"#ff3d00",

			];
		/* Diferentes corazones*/
		const simbolos = [
			"💗"
			"💝"
			"❤️"

			];

		/* Crear 60 corazones */ 
		for (let i = 0; i  60; i++) {

			const heart = 
				document.createElement("div");

			heart.className = "heart";

			heart.textContent =
				simbolos[
					math.ramdom() *
					simbolos.length
					)
		];
		heart.style.left =
			math.ramdom() * 100 + "%";

		heart.style.color =
			colores[
				math.floor(
					math.ramdom() *
					colores.length
					)
				];
			heart.style.fonstSize =
				(12 + Math.ramdom() * 25 ) + "px";
			heart.style.animationDuration =
				(5 + Math.ramdom() * 8 ) + "s";
			heart.style.animationDelay =
				(-Math.ramdom() * 12) + "s";

			document
			.getElementById("hearts")
			.appendChild(heart);
			
		}

	</script>

</body>
</html>-
